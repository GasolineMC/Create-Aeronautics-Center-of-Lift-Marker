org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
# Oldest NeoForge any Create Aeronautics release runs on; everything used here exists from 21.1.0 on
neo_version_range=[21.1.219,)
loader_version_range=[1,)

mod_id=lift_marker
mod_name=Create Aeronautics: Lift Marker
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.liftmarker

# Every Create Aeronautics and Sable release for 1.21.1 has been checked. Newer ones are allowed too:
# if one changes something the marker relies on, the marker turns itself off instead of crashing.
simulated_version_range=[1.0.2,)
sable_version_range=[1.0.4,)

# Folder holding the Create, Create Aeronautics and Sable jars to compile against. They are unpacked into
# build/ at compile time and never bundled into our jar. Either copy them into libs/ or point this at a
# mods folder in ~/.gradle/gradle.properties.
deps_mods_dir=libs
